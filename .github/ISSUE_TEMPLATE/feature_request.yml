name: Sugerir melhoria
description: Proponha uma evolução de produto ou engenharia.
title: "[Melhoria]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qual necessidade de usuário ou operação deve ser resolvida?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva a solução e os critérios de aceitação.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Riscos e dependências
      description: Permissões, integrações, migrações, dados ou ações sensíveis envolvidos.
