[package]
name = "portal-vesper"
version = "1.0.0"
description = "Portal Vesper Desktop"
authors = ["Portal Vesper"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.6.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
